info:
  title: HRHelper API (HR Enterprise Platform)
  description: "REST API /api/v1. Xác thực: Bearer JWT do Keycloak (OIDC) cấp.
    Lỗi: {code, message, traceId}."
  version: 0.1.0 (tuần 7)
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateDepartmentDto:
      type: object
      properties:
        unitType:
          type: string
          enum: &a19
            - COMPANY
            - CENTER
            - DEPARTMENT
            - TEAM
          example: DEPARTMENT
          description: "ADR-14: Công ty, Trung tâm, Phòng, Nhóm"
        code:
          type: string
          example: ENG-PLT
        name:
          type: string
          example: Platform Engineering
        office:
          type: string
          example: Hà Nội
        parentId:
          type: object
        headEmployeeId:
          type: object
        headActing:
          type: boolean
          description: 'FR-2.9: trưởng là "Quyền trưởng"'
        deputyEmployeeIds:
          description: "Phó đơn vị (thay cả danh sách); tối đa theo loại: Công ty 5, Trung
            tâm 3, Phòng 3, Nhóm 0"
          type: array
          items:
            type: string
      required:
        - unitType
        - code
        - name
        - office
    UpdateDepartmentDto:
      type: object
      properties:
        unitType:
          type: string
          enum: *a19
        name:
          type: string
        office:
          type: string
        parentId:
          type: object
          nullable: true
        headEmployeeId:
          type: object
          nullable: true
        headActing:
          type: boolean
          description: 'FR-2.9: trưởng là "Quyền trưởng"'
        deputyEmployeeIds:
          description: "Phó đơn vị (thay cả danh sách); tối đa theo loại: Công ty 5, Trung
            tâm 3, Phòng 3, Nhóm 0"
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          description: "INACTIVE: ngừng hoạt động (FR-2.10), chỉ khi đơn vị đã trống"
    CreatePositionDto:
      type: object
      properties:
        code:
          type: string
          example: PM
        title:
          type: string
          example: Quản lý dự án
        level:
          type: number
          minimum: 1
          maximum: 10
      required:
        - code
        - title
        - level
    UpdatePositionDto:
      type: object
      properties:
        title:
          type: string
        level:
          type: number
          minimum: 1
          maximum: 10
        active:
          type: boolean
    MeEmployee:
      type: object
      properties:
        id:
          type: string
        employeeCode:
          type: string
        fullName:
          type: string
      required:
        - id
        - employeeCode
        - fullName
    MeResponse:
      type: object
      properties:
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        employee:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MeEmployee"
      required:
        - email
        - roles
        - employee
    CreateEmployeeDto:
      type: object
      properties:
        employeeCode:
          type: string
          example: E02001
        fullName:
          type: string
        workEmail:
          type: string
        phone:
          type: string
        departmentId:
          type: string
        positionId:
          type: string
        managerId:
          type: string
        hireDate:
          type: string
          example: 2026-11-01
        dateOfBirth:
          type: string
        address:
          type: string
        nationalId:
          type: string
          description: CCCD (12 số)
        bankAccount:
          type: string
        salary:
          type: string
          description: Lương tháng (VND)
      required:
        - employeeCode
        - fullName
        - workEmail
        - departmentId
        - positionId
        - hireDate
    SectionSummary:
      type: object
      properties:
        code:
          type: string
          example: personal
        group:
          type: string
          enum:
            - personal
            - work
            - finance
            - benefits
            - other
        title:
          type: string
        available:
          type: boolean
          description: 'false: mục chưa làm, giao diện hiện tiêu đề đỏ "Chưa có" và không
            gọi API'
        pendingRequests:
          type: number
          description: Số yêu cầu cập nhật đang chờ HR (luôn 0 cho tới khi có FR-1.9)
      required:
        - code
        - group
        - title
        - available
        - pendingRequests
    ProfileSummary:
      type: object
      properties:
        id:
          type: string
        employeeCode:
          type: string
        fullName:
          type: string
        positionTitle:
          type: object
          nullable: true
        departmentId:
          type: string
        departmentName:
          type: object
          nullable: true
        managerId:
          type: object
          nullable: true
        managerName:
          type: object
          nullable: true
        phone:
          type: object
          nullable: true
        workEmail:
          type: string
        relation:
          type: string
          enum:
            - HR
            - OWNER
            - MANAGER
            - OTHER
        canEdit:
          type: boolean
          description: 'HR: hiện nút "Sửa hồ sơ"'
        hasAvatar:
          type: boolean
          description: "Có ảnh đại diện đã duyệt: tải ở GET /employees/{id}/avatar"
        contractType:
          type: object
          nullable: true
          description: 'Loại hợp đồng đang hiệu lực (hàng "Diện đối tượng", mức QL). null:
            chưa có dữ liệu. Không có trường này ở mức danh bạ'
        sections:
          description: Mục người xem được thấy, theo thứ tự trên trang
          type: array
          items:
            $ref: "#/components/schemas/SectionSummary"
      required:
        - id
        - employeeCode
        - fullName
        - positionTitle
        - departmentId
        - departmentName
        - managerId
        - managerName
        - phone
        - workEmail
        - relation
        - canEdit
        - hasAvatar
        - sections
    MaskedField:
      type: object
      properties:
        hasValue:
          type: boolean
        value:
          type: object
          nullable: true
      required:
        - hasValue
