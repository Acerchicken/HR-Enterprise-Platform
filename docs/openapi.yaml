# Sinh tự động từ code – không sửa tay. Cập nhật: npm run openapi (trong backend/)
openapi: 3.0.0
paths:
  /api/v1/health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - health
  /api/v1/audit-logs:
    get:
      operationId: AuditController_search
      parameters:
        - name: entity
          required: false
          in: query
          schema:
            example: employee
            enum:
              - employee
              - department
              - position
              - leave_request
              - leave_balance
              - holiday
              - approval_delegation
              - document
              - user_account
              - role_assignment
              - assistant_config
            type: string
        - name: entityId
          required: false
          in: query
          schema:
            type: string
        - name: actor
          required: false
          in: query
          description: UUID hồ sơ nhân viên của người thực hiện
          schema:
            type: string
        - name: action
          required: false
          in: query
          description: Một hoặc nhiều hành động (lặp tham số hoặc ngăn bằng dấu phẩy), UC7
            D3
          schema:
            type: array
            items:
              type: string
              enum:
                - CREATE
                - UPDATE
                - VIEW_SENSITIVE
                - PROFILE_CHANGE_SUBMIT
                - PROFILE_CHANGE_CANCEL
                - PROFILE_CHANGE_APPROVE
                - PROFILE_CHANGE_REJECT
                - PROFILE_ITEM_CREATE
                - PROFILE_ITEM_UPDATE
                - PROFILE_ITEM_DELETE
                - PROFILE_FILE_UPLOAD
                - PROFILE_FILE_DELETE
                - PROFILE_FILE_DOWNLOAD
                - TRANSFER_SCHEDULE
                - TRANSFER_CANCEL
                - TRANSFER
                - TRANSFER_FAIL
                - LEAVE_SUBMIT
                - LEAVE_APPROVE
                - LEAVE_REJECT
                - LEAVE_HR_APPROVE
                - LEAVE_HR_REJECT
                - LEAVE_CANCEL
                - LEAVE_CANCEL_REQUEST
                - LEAVE_CANCEL_APPROVED
                - LEAVE_CANCEL_REQUEST_REJECT
                - LEAVE_COMPLETE
                - LEAVE_SYSTEM_CANCEL
                - LEAVE_RECALCULATE
                - VIEW_LEAVE_REASON
                - LEAVE_BALANCE_ADJUST
                - LEAVE_BALANCE_OVERDRAWN
                - HOLIDAY_CREATE
                - HOLIDAY_DELETE
                - DELEGATION_CREATE
                - DELEGATION_END
                - DOCUMENT_CREATE
                - DOCUMENT_PUBLISH
                - DOCUMENT_UPDATE
                - DOCUMENT_HIDE
                - DOCUMENT_RESTORE
                - ACCOUNT_INVITE
                - ACCOUNT_SYNC_FAILED
                - ROLE_GRANT
                - ROLE_REVOKE
                - ASSISTANT_CONFIG_UPDATE
                - ASSISTANT_CONFIG_TEST
        - name: from
          required: false
          in: query
          description: YYYY-MM-DD (00:00 giờ Việt Nam) hoặc ngày giờ ISO 8601; tính cả mốc
          schema:
            example: 2026-11-01
            type: string
        - name: to
          required: false
          in: query
          description: YYYY-MM-DD (tính cả ngày, giờ Việt Nam) hoặc ngày giờ ISO 8601;
            tính cả mốc
          schema:
            example: 2026-11-01
            type: string
      responses:
        "200":
          description: ""
      tags:
        - audit
      security:
        - bearer: []
  /api/v1/departments:
    get:
      operationId: OrganizationController_list
      parameters: []
      responses:
        "200":
          description: ""
      tags: &a1
        - organization
      security: &a2
        - bearer: []
    post:
      operationId: OrganizationController_create
      parameters: []
