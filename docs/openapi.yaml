info:
  title: HRHelper API (HR Enterprise Platform)
  description: "REST API /api/v1. Xác thực: Bearer JWT do Keycloak (OIDC) cấp.
    Lỗi: {code, message, traceId}."
  version: 0.1.0 (tuần 7)
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateDepartmentDto:
      type: object
      properties:
        code:
          type: string
          example: ENG-PLT
        name:
          type: string
          example: Platform Engineering
        office:
          type: string
          example: Hà Nội
        parentId:
          type: object
        headEmployeeId:
          type: object
      required:
        - code
        - name
        - office
    UpdateDepartmentDto:
      type: object
      properties:
        name:
          type: string
        office:
          type: string
        parentId:
          type: object
          nullable: true
        headEmployeeId:
          type: object
          nullable: true
    CreateEmployeeDto:
      type: object
      properties:
        employeeCode:
          type: string
          example: E02001
        fullName:
          type: string
        workEmail:
          type: string
        phone:
          type: string
        departmentId:
          type: string
        positionId:
          type: string
        managerId:
          type: string
        hireDate:
          type: string
          example: 2026-11-01
        dateOfBirth:
          type: string
        address:
          type: string
        nationalId:
          type: string
          description: CCCD (12 số)
        bankAccount:
          type: string
        salary:
          type: string
          description: Lương tháng (VND)
      required:
        - employeeCode
        - fullName
        - workEmail
        - departmentId
        - positionId
        - hireDate
    UpdateEmployeeDto:
      type: object
      properties:
        version:
          type: number
          description: Version hiện tại (optimistic locking). Lệch → 409.
        phone:
          type: string
          example: 0912 345 678
        address:
          type: string
        fullName:
          type: string
        dateOfBirth:
          type: string
        departmentId:
          type: string
        positionId:
          type: string
        managerId:
          type: object
          nullable: true
        status:
          type: string
          enum:
            - ACTIVE
            - ON_LEAVE
            - TERMINATED
        nationalId:
          type: string
          description: CCCD (12 số)
        bankAccount:
          type: string
        salary:
          type: string
          description: Lương tháng (VND)
    CreateLeaveRequestDto:
      type: object
      properties:
        leaveType:
          type: string
          example: ANNUAL
          description: Mã loại phép (GET /leave-types)
        startDate:
          type: string
          example: 2026-11-09
        endDate:
          type: string
          example: 2026-11-10
        halfDay:
          type: string
          enum:
            - AM
            - PM
          description: Nghỉ nửa ngày (chỉ khi startDate = endDate)
        reason:
          type: string
      required:
        - leaveType
        - startDate
        - endDate
    LeaveDecisionDto:
      type: object
      properties:
        version:
          type: number
          description: Version hiện tại của đơn (optimistic locking). Lệch → 409.
        comment:
          type: string
          description: Ghi chú, ví dụ lý do từ chối
      required:
        - version
    DocumentScopeDto:
      type: object
      properties:
        all:
          type: boolean
          default: false
        departmentIds:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
            enum:
              - EMPLOYEE
              - MANAGER
              - HR
              - ADMIN
    CreateDocumentDto:
      type: object
      properties:
        fileName:
          type: string
          example: quy-che-lam-viec.pdf
        contentType:
          type: string
          example: application/pdf
        sizeBytes:
          type: number
          example: 4194304
          maximum: 20971520
        title:
          type: string
          example: Quy chế làm việc
        type:
          type: string
          enum: &a9
            - POLICY
            - PROCESS
            - GUIDE
            - FORM
            - NOTICE
        scope:
          $ref: "#/components/schemas/DocumentScopeDto"
      required:
        - fileName
        - contentType
        - sizeBytes
        - title
        - type
        - scope
    FileSpecDto:
      type: object
      properties:
        fileName:
          type: string
          example: quy-che-lam-viec.pdf
        contentType:
          type: string
          example: application/pdf
        sizeBytes:
          type: number
          example: 4194304
          maximum: 20971520
      required:
        - fileName
        - contentType
        - sizeBytes
    UpdateDocumentDto:
      type: object
      properties:
        version:
          type: number
          description: Version hiện tại của tài liệu (optimistic locking). Lệch → 409.
        title:
          type: string
        type:
          type: string
          enum: *a9
        scope:
          $ref: "#/components/schemas/DocumentScopeDto"
      required:
        - version
