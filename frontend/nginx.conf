server {
  listen 8080;
  root /usr/share/nginx/html;

  # Header bảo mật cho web (NFR-5.22). connect-src cho phép gọi API và IdP qua HTTPS (staging) hoặc localhost (docker compose).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://localhost:3000 http://localhost:8080; frame-src https: http://localhost:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https: http://localhost:8080" always;

  # SPA: mọi đường dẫn không phải file tĩnh trả về index.html
  location / {
    try_files $uri /index.html;
  }
}
