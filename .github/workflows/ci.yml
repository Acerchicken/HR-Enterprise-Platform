name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  backend:
    name: Backend (Lint & Unit Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types & lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

  # N9: 150+ ca e2e (API thật + Postgres thật, AUTH_MODE=dev, kho tài liệu giả trong bộ nhớ, không queue) chạy ở mỗi PR,
  # cùng kiểm tra docs/openapi.yaml khớp code (docs-as-code: đổi API mà quên `npm run openapi` thì job đỏ).
  backend-e2e:
    name: Backend (E2E & OpenAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr
          POSTGRES_DB: hr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr -d hr" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: localhost
      DB_USER: hr
      DB_PASSWORD: hr
      DB_NAME: hr
      DB_SSL: 'off'
      AUTH_MODE: dev
      APP_VERSION: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations & seed
        run: npm run migration:run && npm run seed

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Check OpenAPI is up to date
        run: |
          npm run openapi
          if ! git diff --exit-code -- ../docs/openapi.yaml; then
            echo "::error file=docs/openapi.yaml::docs/openapi.yaml lệch với code. Chạy 'npm run openapi' trong backend/ rồi commit."
            exit 1
          fi

  assistant:
    name: Assistant Service (Lint & Test)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr
          POSTGRES_DB: hr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr -d hr" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: localhost
      DB_USER: hr
      DB_PASSWORD: hr
      DB_NAME: hr
      DB_SSL: 'off'
      ALLOW_DEV_SECRETS: 'true'
      FIELD_ENCRYPTION_KEY: ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=
      TEST_DB_URL: postgres://hr:hr@localhost:5432/hr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            services/assistant/package-lock.json

      # Schema assistant do migration của backend tạo (ADR-16), test tích hợp của service cần nó.
      - name: Run backend migrations
        working-directory: backend
        run: npm ci && npm run migration:run

      - name: Install dependencies
        working-directory: services/assistant
        run: npm ci

      - name: Check types
        working-directory: services/assistant
        run: npm run lint

      - name: Run tests (unit + Postgres)
        working-directory: services/assistant
        run: npm test

  notification:
    name: Notification Service (Lint & Test)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hr
          POSTGRES_PASSWORD: hr
          POSTGRES_DB: hr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr -d hr" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: localhost
      DB_USER: hr
      DB_PASSWORD: hr
      DB_NAME: hr
      DB_SSL: 'off'
      ALLOW_DEV_SECRETS: 'true'
      FIELD_ENCRYPTION_KEY: ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=
      TEST_DB_URL: postgres://hr:hr@localhost:5432/hr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Tiêu chí nghiệm thu ADR-15: service tách ra không dùng code của backend (chỉ giao tiếp qua event, HTTP).
      - name: Services do not import backend code
        run: |
          if grep -rnE "from ['\"](\.\./)+backend/|require\(['\"](\.\./)+backend/" services/*/src; then
            echo "::error::services/* không được import code của backend/ (ADR-15)"; exit 1
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            services/notification/package-lock.json

      # Bảng notification.processed_event và role notification_svc do migration của backend tạo.
      - name: Run backend migrations
        working-directory: backend
        run: npm ci && npm run migration:run

      - name: Install dependencies
        working-directory: services/notification
        run: npm ci

      - name: Check types
        working-directory: services/notification
        run: npm run lint

      - name: Run tests (unit + Postgres)
        working-directory: services/notification
        run: npm test

  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  docker-backend:
    name: Docker Backend (Build & Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (API & Worker)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: hr-platform-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hr-platform-api:test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          scanners: 'vuln'
          trivyignores: '.trivyignore'

  docker-assistant:
    name: Docker Assistant (Build & Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build assistant image (tải model EmbeddingGemma)
        uses: docker/build-push-action@v6
        with:
          context: ./services/assistant
          file: ./services/assistant/Dockerfile
          push: false
          load: true
          tags: hr-platform-assistant:test
          cache-from: type=gha,scope=assistant
          cache-to: type=gha,mode=max,scope=assistant

      - name: Scan assistant image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hr-platform-assistant:test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          scanners: 'vuln'
          trivyignores: '.trivyignore'

  docker-notification:
    name: Docker Notification (Build & Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build notification image
        uses: docker/build-push-action@v6
        with:
          context: ./services/notification
          file: ./services/notification/Dockerfile
          push: false
          load: true
          tags: hr-platform-notification:test
          cache-from: type=gha,scope=notification
          cache-to: type=gha,mode=max,scope=notification

      - name: Scan notification image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hr-platform-notification:test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          scanners: 'vuln'
          trivyignores: '.trivyignore'

  docker-frontend:
    name: Docker Frontend (Build & Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: hr-platform-web:test
          build-args: |
            VITE_API_URL=http://localhost:3000/api/v1
            VITE_OIDC_AUTHORITY=http://localhost:8080/realms/hr
            VITE_OIDC_CLIENT_ID=hr-web
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hr-platform-web:test
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          scanners: 'vuln'
          trivyignores: '.trivyignore'
